<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" width="1600" height="920" role="img" aria-labelledby="t d" font-family="Archivo,system-ui,Arial,sans-serif">
  <title id="t">Waarde-opbouw batterij vast contract</title><desc id="d">Afgeleid vast-contractscenario: vermeden inkoop plus vermeden terugleverkosten min gemiste terugleververgoeding vormen de totale waarde na 2027; ongeveer 318 euro daarvan is het extra 2027-effect ten opzichte van de situatie met saldering.</desc>
  <rect width="1600" height="920" fill="#F7F6F2"/><text x="150" y="100" font-size="42" font-weight="800" fill="#12130F" text-anchor="start">Waaruit bestaat de batterijwaarde? (vast contract)</text><text x="150" y="138" font-size="22" font-weight="700" fill="#4C4D46" text-anchor="start">Afgeleid vast-contractscenario · 4.300 kWh · 1.760 kWh = aangenomen jaarlijkse doorzet (geen fysiek batterijmax)</text><rect x="150" y="421.8" width="210" height="238.2" fill="#FFD100" stroke="#12130F" stroke-width="2"/><text x="255" y="409.8" font-size="22" font-weight="800" fill="#12130F" text-anchor="middle">+397</text><text x="255" y="694" font-size="18" font-weight="700" fill="#4C4D46" text-anchor="middle">Vermeden inkoop</text><rect x="420" y="295.2" width="210" height="126.60000000000002" fill="#E8A24C" stroke="#12130F" stroke-width="2"/><text x="525" y="283.2" font-size="22" font-weight="800" fill="#12130F" text-anchor="middle">+211</text><text x="525" y="694" font-size="18" font-weight="700" fill="#4C4D46" text-anchor="middle">Vermeden terugleverkosten</text><rect x="690" y="295.2" width="210" height="73.80000000000001" fill="#B4592E" stroke="#12130F" stroke-width="2"/><text x="795" y="283.2" font-size="22" font-weight="800" fill="#12130F" text-anchor="middle">−123</text><text x="795" y="694" font-size="18" font-weight="700" fill="#4C4D46" text-anchor="middle">Gemiste terugleververgoeding</text><rect x="960" y="369" width="210" height="291" fill="#12130F" /><text x="1065" y="357" font-size="24" font-weight="800" fill="#12130F" text-anchor="middle">= 485</text><text x="1065" y="694" font-size="18" font-weight="700" fill="#12130F" text-anchor="middle">Totale waarde ná 2027</text><line x1="150" y1="559.8" x2="1170" y2="559.8" stroke="#12130F" stroke-width="3" stroke-dasharray="10 8"/><text x="1170" y="549.8" font-size="20" font-weight="700" fill="#4C4D46" text-anchor="end" font-family="IBM Plex Mono,monospace">vóór 2027 ≈ €167</text><rect x="1194" y="369" width="26" height="190.79999999999995" fill="#FFD100" stroke="#12130F" stroke-width="2"/><text x="1240" y="464.4" font-size="22" font-weight="800" fill="#12130F" text-anchor="start">2027-effect ≈ €318</text><text x="150" y="880" font-size="19" font-weight="500" fill="#4C4D46" text-anchor="start" font-family="IBM Plex Mono,monospace">Afgeleid vast-contractscenario — afnametarief €0,25 (CBS juni 2026); terugleververgoeding = 50% × gekozen kaal leveringstarief (scenariowaarde, geen officieel tarief).</text></svg>