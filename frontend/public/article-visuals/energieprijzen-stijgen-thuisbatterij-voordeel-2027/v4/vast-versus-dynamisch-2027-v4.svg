<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" font-family="Archivo,system-ui,Arial,sans-serif">
  <title id="t">Vast versus dynamisch</title><desc id="d">Twee vaste-contractvoorbeelden met een 2027-effect van circa 318 euro; voor dynamische contracten is het 2027-verschil niet te kwantificeren zonder kwartierdata en contractvoorwaarden.</desc>
  <rect width="1600" height="900" fill="#F7F6F2"/><text x="150" y="90" font-size="42" font-weight="800" fill="#12130F" text-anchor="start">Vast versus dynamisch: waar komt het verschil vandaan?</text><text x="150" y="128" font-size="22" font-weight="700" fill="#4C4D46" text-anchor="start">Vast: afgeleid scenario. Dynamisch: 2027-effect niet te kwantificeren met beschikbare data.</text><line x1="150" y1="680" x2="670" y2="680" stroke="#00000018" stroke-width="2"/><text x="136" y="686" font-size="18" font-weight="700" fill="#4C4D46" text-anchor="end" font-family="IBM Plex Mono,monospace">0</text><line x1="150" y1="562.5" x2="670" y2="562.5" stroke="#00000018" stroke-width="2"/><text x="136" y="568.5" font-size="18" font-weight="700" fill="#4C4D46" text-anchor="end" font-family="IBM Plex Mono,monospace">250</text><line x1="150" y1="445" x2="670" y2="445" stroke="#00000018" stroke-width="2"/><text x="136" y="451" font-size="18" font-weight="700" fill="#4C4D46" text-anchor="end" font-family="IBM Plex Mono,monospace">500</text><line x1="150" y1="327.5" x2="670" y2="327.5" stroke="#00000018" stroke-width="2"/><text x="136" y="333.5" font-size="18" font-weight="700" fill="#4C4D46" text-anchor="end" font-family="IBM Plex Mono,monospace">750</text><line x1="150" y1="210" x2="670" y2="210" stroke="#00000018" stroke-width="2"/><text x="136" y="216" font-size="18" font-weight="700" fill="#4C4D46" text-anchor="end" font-family="IBM Plex Mono,monospace">1000</text><text x="136" y="194" font-size="18" font-weight="700" fill="#4C4D46" text-anchor="end" font-family="IBM Plex Mono,monospace">€/jr</text><rect x="170" y="452.05" width="230" height="227.95" fill="#FFD100" stroke="#12130F" stroke-width="2"/><text x="285" y="440.05" font-size="24" font-weight="800" fill="#12130F" text-anchor="middle">€485</text><text x="285" y="714" font-size="20" font-weight="700" fill="#12130F" text-anchor="middle">Vast +TLK</text><text x="285" y="738" font-size="17" font-weight="700" fill="#4C4D46" text-anchor="middle">2027-effect €318</text><rect x="440" y="551.22" width="230" height="128.78" fill="#FFD100" stroke="#12130F" stroke-width="2"/><text x="555" y="539.22" font-size="24" font-weight="800" fill="#12130F" text-anchor="middle">€274</text><text x="555" y="714" font-size="20" font-weight="700" fill="#12130F" text-anchor="middle">Vast lage TLK</text><text x="555" y="738" font-size="17" font-weight="700" fill="#4C4D46" text-anchor="middle">2027-effect €318</text><rect x="790" y="210" width="640" height="470" rx="16" fill="#EAF2FB" stroke="#12130F" stroke-width="3"/><text x="1110" y="300" font-size="30" font-weight="800" fill="#12130F" text-anchor="middle">Dynamisch contract</text><text x="1110" y="350" font-size="24" font-weight="700" fill="#B4592E" text-anchor="middle">contract- en kwartierdata nodig</text><text x="830" y="430" font-size="21" font-weight="700" fill="#12130F" text-anchor="start">Saldering geldt ook vóór 2027 voor dynamische</text><text x="830" y="460" font-size="21" font-weight="700" fill="#12130F" text-anchor="start">contracten. Het 2027-verschil hangt af van de</text><text x="830" y="490" font-size="21" font-weight="700" fill="#12130F" text-anchor="start">verrekenmethode, kwartierprijzen en voorwaarden.</text><text x="830" y="550" font-size="21" font-weight="700" fill="#12130F" text-anchor="start">Prijssturing kan waarde geven — maar dat is</text><text x="830" y="580" font-size="21" font-weight="700" fill="#12130F" text-anchor="start">geen salderingseffect.</text><text x="150" y="790" font-size="19" font-weight="500" fill="#4C4D46" text-anchor="start" font-family="IBM Plex Mono,monospace">Vast: afgeleid scenario. Dynamisch: geen euro-delta zonder contract-specifieke backtest.</text></svg>