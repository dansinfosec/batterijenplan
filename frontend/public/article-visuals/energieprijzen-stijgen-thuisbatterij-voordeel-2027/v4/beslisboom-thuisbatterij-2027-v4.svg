<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-labelledby="t d" font-family="Archivo,system-ui,Arial,sans-serif">
  <title id="t">Beslisboom 2027</title><desc id="d">Vijf ja/nee-vragen leiden naar klein, matig of substantieel extra voordeel, of naar 'meer data nodig'.</desc>
  <rect width="1600" height="800" fill="#F7F6F2"/><text x="120" y="90" font-size="42" font-weight="800" fill="#12130F" text-anchor="start">Hoeveel verschil maakt 2027 voor mij?</text><rect x="120" y="150" width="760" height="70" rx="12" fill="#FFD100" stroke="#12130F" stroke-width="3"/><text x="500" y="194" font-size="22" font-weight="700" fill="#12130F" text-anchor="middle">1. Zonnepanelen?</text><line x1="500" y1="220" x2="500" y2="222" stroke="#12130F" stroke-width="6" stroke-linecap="round"/><polygon points="500,246 487,222 513,222" fill="#12130F"/><rect x="120" y="246" width="760" height="70" rx="12" fill="#FFD100" stroke="#12130F" stroke-width="3"/><text x="500" y="290" font-size="22" font-weight="700" fill="#12130F" text-anchor="middle">2. Veel teruglevering per jaar?</text><line x1="500" y1="316" x2="500" y2="318" stroke="#12130F" stroke-width="6" stroke-linecap="round"/><polygon points="500,342 487,318 513,318" fill="#12130F"/><rect x="120" y="342" width="760" height="70" rx="12" fill="#FFD100" stroke="#12130F" stroke-width="3"/><text x="500" y="386" font-size="22" font-weight="700" fill="#12130F" text-anchor="middle">3. Weinig verbruik overdag?</text><line x1="500" y1="412" x2="500" y2="414" stroke="#12130F" stroke-width="6" stroke-linecap="round"/><polygon points="500,438 487,414 513,414" fill="#12130F"/><rect x="120" y="438" width="760" height="70" rx="12" fill="#FFD100" stroke="#12130F" stroke-width="3"/><text x="500" y="482" font-size="22" font-weight="700" fill="#12130F" text-anchor="middle">4. Betaalt u terugleverkosten?</text><line x1="500" y1="508" x2="500" y2="510" stroke="#12130F" stroke-width="6" stroke-linecap="round"/><polygon points="500,534 487,510 513,510" fill="#12130F"/><rect x="120" y="534" width="760" height="70" rx="12" fill="#FFD100" stroke="#12130F" stroke-width="3"/><text x="500" y="578" font-size="22" font-weight="700" fill="#12130F" text-anchor="middle">5. Vast of variabel contract?</text><rect x="1000" y="180" width="300" height="80" rx="12" fill="#F1EFE8" stroke="#12130F" stroke-width="3"/><text x="1150" y="228" font-size="22" font-weight="800" fill="#12130F" text-anchor="middle">Vast: klein extra voordeel</text><rect x="1000" y="300" width="300" height="80" rx="12" fill="#FFF6CC" stroke="#12130F" stroke-width="3"/><text x="1150" y="348" font-size="22" font-weight="800" fill="#12130F" text-anchor="middle">Vast: matig extra voordeel</text><rect x="1000" y="420" width="300" height="80" rx="12" fill="#FBEEE6" stroke="#12130F" stroke-width="3"/><text x="1150" y="468" font-size="22" font-weight="800" fill="#12130F" text-anchor="middle">Vast: substantieel voordeel</text><rect x="1000" y="540" width="300" height="80" rx="12" fill="#EAF2FB" stroke="#12130F" stroke-width="3"/><text x="1150" y="588" font-size="22" font-weight="800" fill="#12130F" text-anchor="middle">Dynamisch: contractdata</text><text x="1000" y="700" font-size="19" font-weight="700" fill="#4C4D46" text-anchor="start" font-family="IBM Plex Mono,monospace">Vast/variabel + meer 'ja' op 2–4 → hoger 2027-effect.</text><text x="1000" y="726" font-size="19" font-weight="700" fill="#B4592E" text-anchor="start" font-family="IBM Plex Mono,monospace">Dynamisch → altijd contract- en kwartierdata nodig.</text><text x="120" y="770" font-size="19" font-weight="500" fill="#4C4D46" text-anchor="start" font-family="IBM Plex Mono,monospace">Beslislogica uit het scenario-overzicht (07) — indicatief, geen garantie</text></svg>