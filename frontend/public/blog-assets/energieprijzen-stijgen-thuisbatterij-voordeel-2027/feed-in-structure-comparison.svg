<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 836 536" width="100%" height="auto" font-family="'Inter','Archivo','Segoe UI',system-ui,Arial,sans-serif" role="img" aria-labelledby="fs-title fs-desc">
  <title id="fs-title">Hoeveel terugleverkosten vermijdt een batterij per tariefstructuur?</title>
  <desc id="fs-desc">Horizontale staafgrafiek van de mediane vermeden terugleverkosten in euro per jaar voor de 12,6 kWh-referentiebatterij (mediaan over 25 huishoudens), per tariefstructuur. Bij een tarief per kWh van 0,15 euro vermijdt een batterij 303 euro; bij 0,10 euro 202 euro; bij 0,05 euro 101 euro. Een hybride structuur (vast plus per kWh) levert 101 euro op, een maandstaffel 92 euro en een jaarstaffel 90 euro. Bij een vast bedrag per maand vermijdt een batterij 0 euro: een vast bedrag kan niet worden vermeden.</desc>
  <defs><pattern id="hatchK" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#F7F6F2"/><path d="M-1,1 l2,-2 M0,9 l9,-9 M8,10 l2,-2" stroke="#12130F" stroke-width="1.7"/></pattern><pattern id="hatchC" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#F7F6F2"/><path d="M-1,1 l2,-2 M0,9 l9,-9 M8,10 l2,-2" stroke="#B4592E" stroke-width="1.9"/></pattern></defs><rect x="12" y="12" width="822" height="522" fill="#12130F"/><rect x="4" y="4" width="822" height="522" fill="#F7F6F2" stroke="#12130F" stroke-width="2.5"/><rect x="5" y="5" width="54" height="9" fill="#FFD100"/>
  <text x="30" y="34" font-size="18" font-weight="700" fill="#12130F">Hoeveel terugleverkosten vermijdt een batterij?</text>
  <text x="30" y="54" font-size="12.5" fill="#4C4D46">Hangt af van de structuur · mediaan €/jaar · 12,6 kWh-referentiebatterij · scenariowaarde</text>

  <!-- baseline -->
  <line x1="260" y1="90" x2="260" y2="430" stroke="#C9C5BA" stroke-width="1"/>

  <!-- per kWh 0,15 -->
  <rect x="260" y="104" width="445" height="28" fill="#FFD100" stroke="#12130F" stroke-width="2"/>
  <text x="250" y="122" font-size="12.5" fill="#12130F" text-anchor="end">per kWh €0,15</text>
  <text x="713" y="122" font-size="12.5" font-weight="700" fill="#12130F" text-anchor="start">€303</text>

  <!-- per kWh 0,10 -->
  <rect x="260" y="154" width="297" height="28" fill="#FFD100" stroke="#12130F" stroke-width="2"/>
  <text x="250" y="172" font-size="12.5" fill="#12130F" text-anchor="end">per kWh €0,10</text>
  <text x="565" y="172" font-size="12.5" font-weight="700" fill="#12130F" text-anchor="start">€202</text>

  <!-- per kWh 0,05 -->
  <rect x="260" y="204" width="148" height="28" fill="#FFD100" stroke="#12130F" stroke-width="2"/>
  <text x="250" y="222" font-size="12.5" fill="#12130F" text-anchor="end">per kWh €0,05</text>
  <text x="416" y="222" font-size="12.5" font-weight="700" fill="#12130F" text-anchor="start">€101</text>

  <!-- hybride -->
  <rect x="260" y="254" width="148" height="28" fill="#B4592E" stroke="#12130F" stroke-width="2"/>
  <text x="250" y="272" font-size="12.5" fill="#12130F" text-anchor="end">hybride (vast + per kWh)</text>
  <text x="416" y="272" font-size="12.5" font-weight="700" fill="#12130F" text-anchor="start">€101</text>

  <!-- maandstaffel -->
  <rect x="260" y="304" width="135" height="28" fill="#B4592E" stroke="#12130F" stroke-width="2"/>
  <text x="250" y="322" font-size="12.5" fill="#12130F" text-anchor="end">maandstaffel</text>
  <text x="403" y="322" font-size="12.5" font-weight="700" fill="#12130F" text-anchor="start">€92</text>

  <!-- jaarstaffel -->
  <rect x="260" y="354" width="132" height="28" fill="#B4592E" stroke="#12130F" stroke-width="2"/>
  <text x="250" y="372" font-size="12.5" fill="#12130F" text-anchor="end">jaarstaffel</text>
  <text x="400" y="372" font-size="12.5" font-weight="700" fill="#12130F" text-anchor="start">€90</text>

  <!-- vast per maand (0) -->
  <rect x="260" y="404" width="10" height="28" fill="#F7F6F2" stroke="#12130F" stroke-width="2"/>
  <text x="250" y="422" font-size="12.5" fill="#12130F" font-weight="600" text-anchor="end">vast per maand</text>
  <text x="272" y="422" font-size="12.5" font-weight="700" fill="#12130F" text-anchor="start">€0 — een batterij kan een vast bedrag niet vermijden</text>

  <!-- legend -->
  <rect x="30" y="452" width="13" height="13" fill="#FFD100" stroke="#12130F" stroke-width="2"/><text x="49" y="463" font-size="11" fill="#4C4D46">per kWh</text>
  <rect x="130" y="452" width="13" height="13" fill="#B4592E" stroke="#12130F" stroke-width="2"/><text x="149" y="463" font-size="11" fill="#4C4D46">staffel / hybride</text>
  <rect x="270" y="452" width="13" height="13" fill="#F7F6F2" stroke="#12130F" stroke-width="2"/><text x="289" y="463" font-size="11" fill="#4C4D46">vast bedrag (niet vermijdbaar)</text>

  <text x="30" y="490" font-size="11" fill="#6B6C64">Bron: bp-dispatch-v1 · outputs/2027-study-v5-1/ · ENGINE RESULT (mediaan over 25 huishoudens, 12,6 kWh)</text>
  <text x="30" y="508" font-size="10.5" fill="#6B6C64">Classificatie: SCENARIO STUDY — geen voorspelling, geen landelijk gemiddelde</text>


<rect x="648" y="22" width="112" height="20" fill="#F7F6F2" stroke="#12130F" stroke-width="2"/><text x="657" y="36" font-size="10.5" font-family="'IBM Plex Mono',ui-monospace,monospace" letter-spacing="0.06em" fill="#12130F">ENGINE RESULT</text>
</svg>
