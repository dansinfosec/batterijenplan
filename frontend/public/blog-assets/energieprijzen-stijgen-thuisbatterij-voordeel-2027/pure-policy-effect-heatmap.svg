  <title id="hm-title">Zuiver beleidseffect (einde saldering) per huishoudprofiel in euro per jaar</title>
  <desc id="hm-desc">Warmtekaart van het zuivere beleidseffect (einde saldering) bij een batterij van 12,6 kWh, zonder terugleverkosten, in euro per jaar. Rijen zijn jaarverbruik, kolommen zijn de PV-verhouding. Bij 2.500 kWh: 172, 233, 222, 255 en 278 euro. Bij 3.500 kWh: 238, 321, 314, 358 en 390 euro. Bij 4.500 kWh: 304, 409, 405, 462 en 502 euro. Bij 6.000 kWh: 403, 541, 541, 613 en 645 euro. Bij 8.000 kWh: 535, 706, 692, 741 en 761 euro. Het effect groeit vooral met het jaarverbruik; het minimum is 172 en het maximum 761 euro per jaar.</desc>
