    <!-- Google Tag Manager — TOESTEMMINGSGESTUURD. De dataLayer staat meteen
         klaar zodat onze eigen events (page_view, generate_lead) gebufferd
         worden, maar gtm.js wordt PAS geladen als de bezoeker toestemming geeft
         voor statistieken of marketing. Dat gebeurt via window.__gtmLoad(),
         aangeroepen door src/consent.js. Zonder toestemming laadt GTM nooit,
         dus GA4 / Google Ads / Meta Pixel kunnen niet vuren. -->
    <script>
      (function (w, d) {
        w.dataLayer = w.dataLayer || [];
        var id = "GTM-M99LXDK2";
        var started = false;
        // Laadt de GTM-container. Idempotent en alleen aan te roepen door de
        // consent-laag (src/consent.js) nadat er toestemming is gegeven.
        w.__gtmLoad = function () {
          if (started || id.indexOf("GTM-") !== 0) return;
          started = true;
          w.dataLayer.push({ "gtm.start": Date.now(), event: "gtm.js" });
          var s = d.createElement("script");
          s.async = true;
          s.src = "https://www.googletagmanager.com/gtm.js?id=" + id;
          d.head.appendChild(s);
        };
      })(window, document);
    </script>
    <!-- End Google Tag Manager -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!-- Perf: fonts-CSS niet-render-blocking via media="print" + onload;
         eerste paint wacht niet op fonts.googleapis.com. display=optional
         voorkomt late swaps/layout shift; op herhaalbezoek komen de fonts
         uit de cache. Archivo alleen in de gebruikte assen. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..115,700..900&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=optional"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..115,700..900&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=optional" rel="stylesheet" />
    </noscript>
    <!-- SVG-favicon (brand-assets concept D, op papierwit zodat de daklijn ook
         in donkere browsertabs leesbaar blijft); .ico blijft als fallback. -->
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="icon" href="/favicon.ico" />
    <!-- Perf: kritieke CSS voor de statische homepage-shell hieronder.
         Alleen systeemfonts, geen afbeeldingen; React ruimt de shell op. -->
    <style>
      /* Overlay bóven de React-app (geen document flow): verwijderen van de
         shell verschuift de pagina eronder niet — dat hield CLS op ~0.77. */
      /* Alleen directe systeemfonts: de shell-H1 (LCP) mag nooit wachten op
         Google Fonts of op variabelen uit de CSS-bundle. */
      /* Geometrie spiegelt de nieuwe React-hero (.hp-hero) zodat de swap geen
         layout shift geeft. Alleen systeemfonts (Arial): de shell-H1 (LCP) mag
         nooit wachten op Google Fonts of op de CSS-bundle. */
      #static-home-shell,#static-home-shell *{font-family:Arial,Helvetica,sans-serif}
      #static-home-shell{position:fixed;inset:0;z-index:9999;overflow:hidden;background:#F7F6F2;color:#12130F;line-height:1.55;-webkit-font-smoothing:antialiased}
      #static-home-shell .shs-w{max-width:1080px;margin:0 auto;padding:0 20px}
      #static-home-shell .shs-header{border-bottom:1px solid rgba(18,19,15,.12)}
      #static-home-shell .shs-brand{display:flex;align-items:center;gap:10px;height:64px;font-weight:700;font-size:20px;letter-spacing:-.02em}
      /* Inline SVG: geen extra request vóór de LCP-paint. Formaten spiegelen
         .logo-mark in de React-header, zodat de swap niets laat verspringen. */
      #static-home-shell .shs-mark{width:26px;height:26px;flex-shrink:0;display:block}
      #static-home-shell .shs-hero{border-bottom:1px solid rgba(18,19,15,.12);padding:44px 0}
      #static-home-shell h1{font-weight:700;font-size:clamp(30px,8vw,44px);line-height:1.05;letter-spacing:-.02em;max-width:16ch;margin:0}
      #static-home-shell h1 span{color:#B4592E}
      #static-home-shell .shs-sub{margin:20px 0 0;max-width:52ch;font-size:16px;color:#4C4D46}
      #static-home-shell .shs-cta{display:block;margin-top:26px;padding:13px 20px;text-align:center;font-weight:700;font-size:16px;text-decoration:none;color:#12130F;background:#FFD100;border:1px solid #12130F;border-radius:6px}
      #static-home-shell .shs-note{margin:20px 0 0;font-size:12px;letter-spacing:.04em;color:#4C4D46}
      @media(min-width:641px){
        #static-home-shell .shs-mark{width:30px;height:30px}
        #static-home-shell .shs-hero{padding:56px 0 52px}
        #static-home-shell h1{font-size:clamp(32px,5vw,52px);line-height:1.04}
        #static-home-shell .shs-sub{margin-top:20px;font-size:18px}
        #static-home-shell .shs-cta{display:inline-block;margin-top:28px;padding:13px 22px;font-size:16px}
        #static-home-shell .shs-note{margin-top:20px}
      }
    </style>
  </head>
  <body>
    <!-- Bewust GEEN GTM <noscript>-iframe: die zou de container zonder
         toestemming laden (no-JS-bezoekers kunnen niet toestemmen). GTM wordt
         uitsluitend na toestemming via JavaScript geladen (zie <head>). -->
    <!-- home-shell:start (scripts/prerender-blog-meta.mjs verwijdert dit blok
         uit de gegenereerde blogpost-HTML) -->
    <!-- Statische homepage-shell: geeft mobiel direct een first paint van de
         hero terwijl de React-bundle laadt. Alleen zichtbaar op "/" (het
         inline script hieronder verwijdert hem op andere paden) en wordt
         door React opgeruimd zodra de app gemount is (App.jsx). -->
    <div id="static-home-shell">
      <div class="shs-header">
        <div class="shs-w"><span class="shs-brand"><svg class="shs-mark" viewBox="0 0 120 120" width="30" height="30" aria-hidden="true" focusable="false"><path d="M22 60 L60 26 L98 60" fill="none" stroke="#12130F" stroke-width="10" stroke-linejoin="miter"/><rect x="36" y="66" width="48" height="8" fill="#FFD100"/><rect x="30" y="82" width="60" height="22" fill="#B4592E"/></svg>Batterijenplan</span></div>
      </div>
      <section class="shs-hero">
        <div class="shs-w">
          <h1>Bereken welke <span>thuisbatterij</span> bij uw woning past</h1>
          <p class="shs-sub">
            Ontvang een persoonlijk capaciteitsadvies op basis van uw
            stroomverbruik, teruglevering en energiedoel.
          </p>
          <a class="shs-cta" href="/calculator">Bereken uw thuisbatterij</a>
          <p class="shs-note">Binnen enkele minuten een eerste indicatie</p>
        </div>
      </section>
    </div>
    <script>
      (function () {
        var p = window.location.pathname;
        if (p !== "/" && p !== "/index.html") {
          var el = document.getElementById("static-home-shell");
          if (el) el.remove();
        }
      })();
    </script>
    <!-- home-shell:end -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
