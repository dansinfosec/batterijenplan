<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- seo:meta:start (statische fallbacks; scripts/prerender-blog-meta.mjs vervangt dit blok per blogpost) -->
    <title>Batterijenplan.nl — Thuisbatterij Calculator & Advies</title>
    <meta name="description" content="Bereken welke thuisbatterij past bij uw verbruik, zonnepanelen en energiedoel. Ontvang direct een eerste indicatie en laat uw berekening gratis controleren." />
    <meta property="og:title" content="Batterijenplan.nl — Thuisbatterij Calculator & Advies" />
    <meta property="og:description" content="Bereken welke thuisbatterij past bij uw verbruik, zonnepanelen en energiedoel. Ontvang direct een eerste indicatie en laat uw berekening gratis controleren." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://batterijenplan.nl/" />
    <meta property="og:site_name" content="Batterijenplan.nl" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Batterijenplan.nl — Thuisbatterij Calculator & Advies" />
    <meta name="twitter:description" content="Bereken welke thuisbatterij past bij uw verbruik, zonnepanelen en energiedoel. Ontvang direct een eerste indicatie en laat uw berekening gratis controleren." />
    <!-- seo:meta:end -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Perf: verbinding met de API alvast opwarmen; de blogposts/tags worden
         direct na het laden van de app opgehaald. -->
    <link rel="preconnect" href="https://api.batterijenplan.nl" crossorigin />
    <!-- Perf: Archivo alleen in de gebruikte assen (wght 700-900, wdth 100-115)
         i.p.v. het volledige variabele bestand; scheelt fors in fontgrootte.
         media="print" + onload maakt de fonts-CSS niet-render-blocking:
         eerste paint wacht niet op Google Fonts (display=swap blijft actief). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..115,700..900&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..115,700..900&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    </noscript>
    <link rel="icon" href="/favicon.ico" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
