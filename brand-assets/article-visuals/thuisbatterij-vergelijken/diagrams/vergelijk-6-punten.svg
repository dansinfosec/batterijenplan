<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720"><rect width="1000" height="720" fill="#F7F6F2"/><text x="60" y="70" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#12130F" text-anchor="start">Vergelijk op deze 6 punten</text><rect x="60" y="130" width="880" height="76" rx="12" fill="#F7F6F2" stroke="#12130F" stroke-width="3"/><rect x="60" y="130" width="12" height="76" rx="6" fill="#FFD100"/><circle cx="112" cy="168" r="20" fill="#FFD100" stroke="#12130F" stroke-width="3"/><text x="112" y="175" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#12130F" text-anchor="middle">1</text><text x="154" y="162" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#12130F" text-anchor="start">Bruikbare capaciteit</text><text x="154" y="188" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#4C4D46" text-anchor="start">kWh die u echt gebruikt (DoD), niet nominaal</text><rect x="60" y="222" width="880" height="76" rx="12" fill="#F7F6F2" stroke="#12130F" stroke-width="3"/><rect x="60" y="222" width="12" height="76" rx="6" fill="#B4592E"/><circle cx="112" cy="260" r="20" fill="#FFD100" stroke="#12130F" stroke-width="3"/><text x="112" y="267" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#12130F" text-anchor="middle">2</text><text x="154" y="254" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#12130F" text-anchor="start">Laad- en ontlaadvermogen</text><text x="154" y="280" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#4C4D46" text-anchor="start">hoe snel de batterij levert en opneemt (kW)</text><rect x="60" y="314" width="880" height="76" rx="12" fill="#F7F6F2" stroke="#12130F" stroke-width="3"/><rect x="60" y="314" width="12" height="76" rx="6" fill="#FFD100"/><circle cx="112" cy="352" r="20" fill="#FFD100" 