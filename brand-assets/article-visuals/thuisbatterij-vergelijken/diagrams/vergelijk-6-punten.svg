ght="76" rx="12" fill="#F7F6F2" stroke="#12130F" stroke-width="3"/><rect x="60" y="590" width="12" height="76" rx="6" fill="#B4592E"/><circle cx="112" cy="628" r="20" fill="#FFD100" stroke="#12130F" stroke-width="3"/><text x="112" y="635" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#12130F" text-anchor="middle">6</text><text x="154" y="622" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#12130F" text-anchor="start">Noodstroom</text><text x="154" y="648" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#4C4D46" text-anchor="start">werkt de batterij bij stroomuitval?</text><text x="60" y="700" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4C4D46" text-anchor="start">Batterijenplan - niet de goedkoopste, maar de best passende batterij.</text></svg>