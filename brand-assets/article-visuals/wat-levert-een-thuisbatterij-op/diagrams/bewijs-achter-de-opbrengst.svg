<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" role="img" aria-labelledby="ttl desc"><title id="ttl">Bewijsladder achter de opbrengstcijfers</title><desc id="desc">Methodologische hiërarchie van marktdata tot validatie; geen nieuwe getallen.</desc><rect width="980" height="640" fill="#F7F6F2"/><text x="40" y="54" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#12130F" text-anchor="start" font-weight="bold" style="">Het bewijs achter de opbrengst</text><text x="40" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4C4D46" text-anchor="start" font-weight="normal" style="">Waar zijn deze opbrengstcijfers op gebaseerd?</text><rect x="70" y="150" width="430" height="46" rx="6" fill="#F4ECD6" stroke="#12130F"/><text x="86" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#12130F" text-anchor="start" font-weight="bold" style="">1. Ruwe marktdata</text><text x="86" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" fill="#4C4D46" text-anchor="start" font-weight="normal" style="">EPEX day-ahead, TenneT verrekenprijzen en balance-delta</text><rect x="70" y="206" width="488" height="46" rx="6" fill="#EBD7BE" stroke="#12130F"/><text x="86" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#12130F" text-anchor="start" font-weight="bold" style="">2. Eigen modelaannames</text><text x="86" y="246" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" fill="#4C4D46" text-anchor="start" font-weight="normal" style="">14 kWh/10 kW, 90% round-trip, causale EMS-beslissing</text><rect x="70" y="262" width="546" height="46" rx="6" fill="#E2C2A6" stroke="#12130F"/><text x="86" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#12130F" text-anchor="start" font-weight="bold" style="">3. 25 huishoud- en zonprofielen</text><text x="86" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" fill="#4C4D46" text-anchor="start" font-weight="normal" style="">5 verbruiksniveaus × 5 opwekverhoudingen</text><rect x="70" y="318" width="604" height="46" rx="6" fill="#D9AD8E" stroke="#12130F"/><text x="86" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#12130F" text-anchor="start" font-weight="bold" style="">4. 135 simulaties</text><text x="86" y="358" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" fill="#4C4D46" text-anchor="start" font-weight="normal" style="">per-kwartier dispatch met afgedwongen energiebalans</text><rect x="70" y="374" width="662" height="46" rx="6" fill="#CF9876" stroke="#12130F"/><text x="86" y="396" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#12130F" text-anchor="start" font-weight="bold" style="">5. Vergelijking 21 leveranciers</text><text x="86" y="414" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" fill="#4C4D46" text-anchor="start" font-weight="normal" style="">zelfde grondslag, kosten en winstdeling</text><rect x="70" y="430" width="720" height="46" rx="6" fill="#C6835E" stroke="#12130F"/><text x="86" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#F7F6F2" text-anchor="start" font-weight="bold" style="">6. Praktijk/referentie (MijnBatterij.nl)</text><text x="86" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" fill="#4C4D46" text-anchor="start" font-weight="normal" style="">losse gerapporteerde jaarresultaten</text><rect x="70" y="486" width="778" height="46" rx="6" fill="#BD6E46" stroke="#12130F"/><text x="86" y="508" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#F7F6F2" text-anchor="start" font-weight="bold" style="">7. Vergeleken met 300+ installaties</text><text x="86" y="526" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" fill="#F7F6F2" text-anchor="start" font-weight="normal" style="">model achteraf naast de praktijk gelegd</text><rect x="70" y="542" width="836" height="46" rx="6" fill="#B4592E" stroke="#12130F"/><text x="86" y="564" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#F7F6F2" text-anchor="start" font-weight="bold" style="">8. Beperkingen en onzekerheid</text><text x="86" y="582" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" fill="#F7F6F2" text-anchor="start" font-weight="normal" style="">modelprofielen, niet-openbare tarieven, marktrisico</text><text x="40" y="616" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4C4D46" text-anchor="start" font-weight="normal" style="font-style:italic;">Elke laag bouwt op de vorige. Dit schema toont de methode; het introduceert geen nieuwe cijfers.</text></svg>