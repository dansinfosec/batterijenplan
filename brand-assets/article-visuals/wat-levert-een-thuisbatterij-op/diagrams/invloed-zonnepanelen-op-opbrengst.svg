<svg xmlns="http://www.w3.org/2000/svg" width="980" height="540" viewBox="0 0 980 540" role="img" aria-labelledby="ttl desc"><title id="ttl">Invloed van zonnepanelen op de batterijopbrengst</title><desc id="desc">Jaaropbrengst bij oplopende zonverhouding, profiel 4.500 kWh; afnemende meeropbrengst. MODEL/SCENARIO.</desc><rect width="980" height="540" fill="#F7F6F2"/><text x="40" y="54" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#12130F" text-anchor="start" font-weight="bold" style="">Invloed van zonnepanelen op de opbrengst</text><text x="40" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4C4D46" text-anchor="start" font-weight="normal" style="">Leveren meer zonnepanelen automatisch veel meer batterijopbrengst op? Profiel: 2-onder-1-kap, 4.500 kWh.</text><rect x="40" y="101" width="144" height="22" rx="11" fill="#B4592E"/><text x="52" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#F7F6F2" text-anchor="start" font-weight="bold" style="">MODEL/SCENARIO</text><rect x="60" y="240" width="170" height="190" rx="6" fill="#ECDAC2" stroke="#12130F"/><text x="145.0" y="230.0" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#12130F" text-anchor="middle" font-weight="bold" style="">€ 684</text><text x="145.0" y="456" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#12130F" text-anchor="middle" font-weight="bold" style="">Geen zon</text><rect x="246" y="218" width="170" height="212" rx="6" fill="#D7AA8B" stroke="#12130F"/><text x="331.0" y="207.77777777777777" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#12130F" text-anchor="middle" font-weight="bold" style="">€ 764</text><text x="331.0" y="456" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#12130F" text-anchor="middle" font-weight="bold" style="">0,5x</text><text x="331.0" y="185.77777777777777" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#B4592E" text-anchor="middle" font-weight="bold" style="">+€ 80</text><rect x="432" y="211" width="170" height="219" rx="6" fill="#D19C7A" stroke="#12130F"/><text x="517.0" y="201.11111111111111" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#12130F" text-anchor="middle" font-weight="bold" style="">€ 788</text><text x="517.0" y="456" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#12130F" text-anchor="middle" font-weight="bold" style="">0,8x</text><text x="517.0" y="179.11111111111111" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4C4D46" text-anchor="middle" font-weight="bold" style="">+€ 24</text><rect x="618" y="204" width="170" height="226" rx="6" fill="#CB8E6A" stroke="#12130F"/><text x="703.0" y="194.44444444444443" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#12130F" text-anchor="middle" font-weight="bold" style="">€ 812</text><text x="703.0" y="456" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#12130F" text-anchor="middle" font-weight="bold" style="">1,2x</text><text x="703.0" y="172.44444444444443" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4C4D46" text-anchor="middle" font-weight="bold" style="">+€ 24</text><rect x="804" y="203" width="170" height="227" rx="6" fill="#CA8B67" stroke="#12130F"/><text x="889.0" y="193.05555555555554" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#12130F" text-anchor="middle" font-weight="bold" style="">€ 817</text><text x="889.0" y="456" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#12130F" text-anchor="middle" font-weight="bold" style="">1,6x</text><text x="889.0" y="171.05555555555554" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4C4D46" text-anchor="middle" font-weight="bold" style="">+€ 5</text><text x="40" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4C4D46" text-anchor="start" font-weight="normal" style="font-style:italic;">Van geen zon naar 0,5× opwek is de stap het grootst; daarna vlakt de meeropbrengst sterk af. Meer panelen</text><text x="40" y="522" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4C4D46" text-anchor="start" font-weight="normal" style="font-style:italic;">helpen, maar met afnemend effect — extra zon concurreert met de handelsruimte. Bron: CANONICAL_METRICS.json.</text></svg>