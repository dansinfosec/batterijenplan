<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><rect width="1200" height="680" fill="#F7F6F2"/><text x="60" y="66" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#12130F" text-anchor="start">Zelfconsumptie versus handel</text><rect x="80" y="100" width="500" height="520" rx="14" fill="#F7F6F2" stroke="#12130F" stroke-width="3"/><rect x="80" y="100" width="500" height="64" rx="14" fill="#FFD100"/><rect x="80" y="140" width="500" height="24" fill="#FFD100"/><text x="108" y="142" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#12130F" text-anchor="start">Zelfconsumptie</text><circle cx="120" cy="204" r="7" fill="#FFD100" stroke="#12130F" stroke-width="2"/><text x="146" y="210" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#12130F" text-anchor="start">Eigen zonnestroom opslaan</text><circle cx="120" cy="284" r="7" fill="#FFD100" stroke="#12130F" stroke-width="2"/><text x="146" y="290" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#12130F" text-anchor="start">voor 's avonds</text><circle cx="120" cy="364" r="7" fill="#FFD100" stroke="#12130F" stroke-width="2"/><text x="146" y="370" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#12130F" text-anchor="start">Laag en voorspelbaar</text><circle cx="120" cy="444" r="7" fill="#FFD100" stroke="#12130F" stroke-width="2"/><text x="146" y="450" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#12130F" text-anchor="start">Nodig: panelen + avondverbruik</text><circle cx="120" cy="524" r="7" fill="#FFD100" stroke="#12130F" stroke-width="2"/><text x="146" y="530" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#12130F" text-anchor="start">Past bij de meeste woningen</text><rect x="620" y="100" width="500" height="520" rx="14" fill="#F7F6F2" stroke="#12130F" stroke-width="3"/><rect x="620" y="100" width="500" height="64" rx="14" fill="#B4592E"/><rect x="620" y="140" width="500" height="24" fill="#B4592E"/><text x="648" y="142" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#12130F" text-anchor="start">Handel (dynamisch)</text><circle cx="660" cy="204" r="7" fill="#B4592E" stroke="#12130F" stroke-width="2"/><text x="686" y="210" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#12130F" text-anchor="start">Ook laden/ontladen op prijs</text><circle cx="660" cy="284" r="7" fill="#B4592E" stroke="#12130F" stroke-width="2"/><text x="686" y="290" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#12130F" text-anchor="start">Meer potentie, meer variatie</text><circle cx="660" cy="364" r="7" fill="#B4592E" stroke="#12130F" stroke-width="2"/><text x="686" y="370" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#12130F" text-anchor="start">Nodig: dynamisch contract + EMS</text><circle cx="660" cy="444" r="7" fill="#B4592E" stroke="#12130F" stroke-width="2"/><text x="686" y="450" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#12130F" text-anchor="start">Gevoelig voor tarieven en sturing</text><circle cx="660" cy="524" r="7" fill="#B4592E" stroke="#12130F" stroke-width="2"/><text x="686" y="530" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#12130F" text-anchor="start">Bij veel teruglevering / zakelijk</text><text x="60" y="660" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4C4D46" text-anchor="start">Batterijenplan - reken uw eigen situatie door met de calculator.</text></svg>