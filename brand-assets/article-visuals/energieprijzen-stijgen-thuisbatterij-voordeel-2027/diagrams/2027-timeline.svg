<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#F7F6F2"/><text x="60" y="70" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#12130F" text-anchor="start">Wat verandert er richting 2027?</text><line x1="90" y1="330" x2="1110" y2="330" stroke="#12130F" stroke-width="6"/><polygon points="1110,330 1086,318 1086,342" fill="#12130F"/><circle cx="230" cy="330" r="16" fill="#FFD100" stroke="#12130F" stroke-width="4"/><rect x="228" y="200" width="4" height="114" fill="#12130F"/><text x="230" y="180" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#12130F" text-anchor="middle">t/m 2026</text><text x="230" y="400" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#4C4D46" text-anchor="middle">Salderen geldt nog: opwek streept</text><text x="230" y="424" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#4C4D46" text-anchor="middle">weg tegen verbruik.</text><circle cx="600" cy="330" r="16" fill="#B4592E" stroke="#12130F" stroke-width="4"/><rect x="598" y="200" width="4" height="114" fill="#12130F"/><text x="600" y="180" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#12130F" text-anchor="middle">1 januari 2027</text><text x="600" y="400" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#4C4D46" text-anchor="middle">Salderingsregeling stopt. U levert nog</text><text x="600" y="424" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#4C4D46" text-anchor="middle">terug, maar tegen een vergoeding.</text><circle cx="960" cy="330" r="16" fill="#12130F" stroke="#12130F" stroke-width="4"/><rect x="958" y="200" width="4" height="114" fill="#12130F"/><text x="960" y="180" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#12130F" text-anchor="middle">tot 2030</text><text x="960" y="400" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#4C4D46" text-anchor="middle">Terugleververgoeding minimaal 50%</text><text x="960" y="424" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#4C4D46" text-anchor="middle">van het kale leveringstarief.</text><text x="60" y="560" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4C4D46" text-anchor="start">Bron: Rijksoverheid (salderingsregeling), geraadpleegd 2026-08-01.</text><text x="60" y="588" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#12130F" text-anchor="start">Batterijenplan</text></svg>