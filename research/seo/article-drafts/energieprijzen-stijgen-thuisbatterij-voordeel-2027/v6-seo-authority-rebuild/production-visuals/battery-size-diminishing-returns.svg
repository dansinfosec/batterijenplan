<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 836 536" width="100%" height="auto" font-family="'Inter','Archivo','Segoe UI',system-ui,Arial,sans-serif" role="img" aria-labelledby="bs-title bs-desc">
  <title id="bs-title">Grotere batterij, nauwelijks meer beleidseffect</title>
  <desc id="bs-desc">Gepaarde staafgrafiek van het zuivere beleidseffect in euro per jaar, zonder terugleverkosten, per batterijgrootte. Bij 7 kWh is de mediaan 391 euro en het maximum 539 euro. Bij 10 kWh is de mediaan 404 euro en het maximum 669 euro. Bij 12,6 kWh is de mediaan 405 euro en het maximum 761 euro. Bij 21,8 kWh is de mediaan 407 euro en het maximum 895 euro. De mediaan stijgt nauwelijks (van 391 naar 407 euro), terwijl het maximum blijft doorstijgen.</desc>
  <defs><pattern id="hatchK" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#F7F6F2"/><path d="M-1,1 l2,-2 M0,9 l9,-9 M8,10 l2,-2" stroke="#12130F" stroke-width="1.7"/></pattern><pattern id="hatchC" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#F7F6F2"/><path d="M-1,1 l2,-2 M0,9 l9,-9 M8,10 l2,-2" stroke="#B4592E" stroke-width="1.9"/></pattern></defs><rect x="12" y="12" width="822" height="522" fill="#12130F"/><rect x="4" y="4" width="822" height="522" fill="#F7F6F2" stroke="#12130F" stroke-width="2.5"/><rect x="5" y="5" width="54" height="9" fill="#FFD100"/>
  <text x="30" y="34" font-size="18" font-weight="700" fill="#12130F">Grotere batterij, nauwelijks meer beleidseffect</text>
  <text x="30" y="54" font-size="12.5" fill="#4C4D46">Mediaan €/jaar (zuiver beleidseffect, zonder terugleverkosten) · scenariowaarde</text>
  <text x="30" y="72" font-size="11.5" font-family="'IBM Plex Mono',ui-monospace,monospace" fill="#8A6D00">ZELFCONSUMPTIE-EFFECT — HANDELSWAARDE NIET MEEGEREKEND</text>

  <!-- gridlines -->
  <line x1="100" y1="410" x2="790" y2="410" stroke="#C9C5BA" stroke-width="1"/>
  <text x="92" y="414" font-size="11" fill="#6B6C64" text-anchor="end">€0</text>
  <line x1="100" y1="310" x2="790" y2="310" stroke="#E7E3DA" stroke-width="1"/>
  <text x="92" y="314" font-size="11" fill="#6B6C64" text-anchor="end">€300</text>
  <line x1="100" y1="210" x2="790" y2="210" stroke="#E7E3DA" stroke-width="1"/>
  <text x="92" y="214" font-size="11" fill="#6B6C64" text-anchor="end">€600</text>
  <line x1="100" y1="110" x2="790" y2="110" stroke="#E7E3DA" stroke-width="1"/>
  <text x="92" y="114" font-size="11" fill="#6B6C64" text-anchor="end">€900</text>

  <!-- 7 kWh -->
  <rect x="132" y="280" width="50" height="130" fill="#FFD100" stroke="#12130F" stroke-width="2"/>
  <text x="157" y="272" font-size="12" font-weight="700" fill="#12130F" text-anchor="middle">€391</text>
  <rect x="188" y="230" width="50" height="180" fill="#B4592E" stroke="#12130F" stroke-width="2"/>
  <text x="213" y="222" font-size="12" font-weight="700" fill="#B4592E" text-anchor="middle">€539</text>
  <text x="185" y="430" font-size="12.5" fill="#12130F" text-anchor="middle">7 kWh</text>

  <!-- 10 kWh -->
  <rect x="302" y="275" width="50" height="135" fill="#FFD100" stroke="#12130F" stroke-width="2"/>
  <text x="327" y="267" font-size="12" font-weight="700" fill="#12130F" text-anchor="middle">€404</text>
  <rect x="358" y="187" width="50" height="223" fill="#B4592E" stroke="#12130F" stroke-width="2"/>
  <text x="383" y="179" font-size="12" font-weight="700" fill="#B4592E" text-anchor="middle">€669</text>
  <text x="355" y="430" font-size="12.5" fill="#12130F" text-anchor="middle">10 kWh</text>

  <!-- 12,6 kWh -->
  <rect x="472" y="275" width="50" height="135" fill="#FFD100" stroke="#12130F" stroke-width="2"/>
  <text x="497" y="267" font-size="12" font-weight="700" fill="#12130F" text-anchor="middle">€405</text>
  <rect x="528" y="156" width="50" height="254" fill="#B4592E" stroke="#12130F" stroke-width="2"/>
  <text x="553" y="148" font-size="12" font-weight="700" fill="#B4592E" text-anchor="middle">€761</text>
  <text x="525" y="430" font-size="12.5" fill="#12130F" text-anchor="middle">12,6 kWh</text>

  <!-- 21,8 kWh -->
  <rect x="642" y="274" width="50" height="136" fill="#FFD100" stroke="#12130F" stroke-width="2"/>
  <text x="667" y="266" font-size="12" font-weight="700" fill="#12130F" text-anchor="middle">€407</text>
  <rect x="698" y="112" width="50" height="298" fill="#B4592E" stroke="#12130F" stroke-width="2"/>
  <text x="723" y="104" font-size="12" font-weight="700" fill="#B4592E" text-anchor="middle">€895</text>
  <text x="695" y="430" font-size="12.5" fill="#12130F" text-anchor="middle">21,8 kWh</text>

  <!-- median trend line + annotation -->
  <line x1="157" y1="280" x2="667" y2="274" stroke="#12130F" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>
  <text x="240" y="460" font-size="12" font-weight="600" fill="#8A6D00">Mediaan vlakt af boven ~10 kWh (391 → 407)</text>

  <!-- legend -->
  <rect x="560" y="450" width="13" height="13" fill="#FFD100" stroke="#12130F" stroke-width="2"/><text x="579" y="461" font-size="11" fill="#4C4D46">mediaan</text>
  <rect x="660" y="450" width="13" height="13" fill="#B4592E" stroke="#12130F" stroke-width="2"/><text x="679" y="461" font-size="11" fill="#4C4D46">maximum</text>

  <text x="30" y="490" font-size="11" fill="#6B6C64">Bron: bp-dispatch-v1 · outputs/2027-study-v5-1/ · ENGINE RESULT (mediaan en maximum over 25 huishoudens)</text>
  <text x="30" y="508" font-size="10.5" fill="#6B6C64">Classificatie: SCENARIO STUDY — geen voorspelling, geen landelijk gemiddelde</text>


