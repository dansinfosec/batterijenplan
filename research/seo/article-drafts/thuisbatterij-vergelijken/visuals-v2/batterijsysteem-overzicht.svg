<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Batterijsysteem: panelen, omvormer, batterij, EMS, meterkast, net</title><desc id="d">Schema van de componenten en de rol van het EMS in het systeem.</desc><rect width="960" height="420" fill="#F7F6F2"/><text x="40" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#12130F" text-anchor="start" font-weight="bold" style="">Het batterijsysteem: van paneel tot net</text><rect x="40" y="69" width="84" height="22" rx="11" fill="#B4592E"/><text x="52" y="84" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#F7F6F2" text-anchor="start" font-weight="bold" style="">SYSTEEM</text><rect x="40" y="170" width="130" height="90" rx="12" fill="#FFD100" stroke="#12130F"/><text x="105.0" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#12130F" text-anchor="middle" font-weight="bold" style="">Zonnepanelen</text><path d="M170 215 L190 215" stroke="#12130F" stroke-width="3" marker-end="url(#a4)"/><rect x="190" y="170" width="130" height="90" rx="12" fill="#E8A24C" stroke="#12130F"/><text x="255.0" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#12130F" text-anchor="middle" font-weight="bold" style="">Omvormer</text><path d="M320 215 L340 215" stroke="#12130F" stroke-width="3" marker-end="url(#a4)"/><rect x="340" y="170" width="130" height="90" rx="12" fill="#B4592E" stroke="#12130F"/><text x="405.0" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#F7F6F2" text-anchor="middle" font-weight="bold" style="">Thuisbatterij</text><path d="M470 215 L490 215" stroke="#12130F" stroke-width="3" marker-end="url(#a4)"/><rect x="490" y="170" width="130" height="90" rx="12" fill="#12130F" stroke="#12130F"/><text x="555.0" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#F7F6F2" text-anchor="middle" font-weight="bold" style="">EMS</text><path d="M620 215 L640 215" stroke="#12130F" stroke-width="3" marker-end="url(#a4)"/><rect x="640" y="170" width="130" height="90" rx="12" fill="#4C4D46" stroke="#12130F"/><text x="705.0" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#F7F6F2" text-anchor="middle" font-weight="bold" style="">Meterkast</text><path d="M770 215 L790 215" stroke="#12130F" stroke-width="3" marker-end="url(#a4)"/><rect x="790" y="170" width="130" height="90" rx="12" fill="#E8A24C" stroke="#12130F"/><text x="855.0" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#12130F" text-anchor="middle" font-weight="bold" style="">Net</text><defs><marker id="a4" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#12130F"/></marker></defs><text x="40" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#12130F" text-anchor="start" font-weight="bold" style="">Het EMS stuurt de batterij aan en bepaalt per moment: eigen zon opslaan of handelen op de markt.</text><text x="40" y="352" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4C4D46" text-anchor="start" font-weight="normal" style="">Elk onderdeel moet op elkaar passen — vooral omvormer, meterkast en aansluiting.</text></svg>