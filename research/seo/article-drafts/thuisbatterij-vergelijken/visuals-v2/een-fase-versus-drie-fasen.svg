<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="t d"><title id="t">Eén fase versus drie fasen</title><desc id="d">Verschil tussen 1-fase en 3-fase aansluiting en het effect op batterijvermogen.</desc><rect width="960" height="440" fill="#F7F6F2"/><text x="40" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#12130F" text-anchor="start" font-weight="bold" style="">Eén fase versus drie fasen</text><rect x="40" y="69" width="119" height="22" rx="11" fill="#B4592E"/><text x="52" y="84" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#F7F6F2" text-anchor="start" font-weight="bold" style="">AANSLUITING</text><rect x="40" y="120" width="420" height="280" rx="10" fill="#F1EFE8" stroke="#12130F"/><text x="60" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#12130F" text-anchor="start" font-weight="bold" style="">1-fase aansluiting</text><text x="60" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4C4D46" text-anchor="start" font-weight="normal" style="">• Vaak in oudere/kleinere woningen</text><text x="60" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4C4D46" text-anchor="start" font-weight="normal" style="">• Lager maximaal vermogen</text><text x="60" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4C4D46" text-anchor="start" font-weight="normal" style="">• Beperkt de laad-/ontlaadsnelheid</text><text x="60" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4C4D46" text-anchor="start" font-weight="normal" style="">• Check of de batterij 1-fase ondersteunt</text><rect x="500" y="120" width="420" height="280" rx="10" fill="#FFFDF0" stroke="#12130F"/><text x="520" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#12130F" text-anchor="start" font-weight="bold" style="">3-fase aansluiting</text><text x="520" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4C4D46" text-anchor="start" font-weight="normal" style="">• Vaak in nieuwere woningen/warmtepomp</text><text x="520" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4C4D46" text-anchor="start" font-weight="normal" style="">• Hoger maximaal vermogen</text><text x="520" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4C4D46" text-anchor="start" font-weight="normal" style="">• Meer ruimte voor snel laden/ontladen</text><text x="520" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4C4D46" text-anchor="start" font-weight="normal" style="">• Batterij/omvormer moet 3-fase zijn</text><text x="40" y="424" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#12130F" text-anchor="start" font-weight="bold" style="">Uw aansluiting bepaalt het haalbare vermogen — laat dit vooraf controleren; het staat op uw meterkast.</text></svg>