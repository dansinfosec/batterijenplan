<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="t d"><title id="t">Wat moet u vergelijken bij een thuisbatterij</title><desc id="d">Tien vergelijkpunten: capaciteit, vermogen, koppeling, EMS, garantie, noodstroom, kosten.</desc><rect width="960" height="560" fill="#F7F6F2"/><text x="40" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#12130F" text-anchor="start" font-weight="bold" style="">Wat moet u vergelijken?</text><rect x="40" y="69" width="101" height="22" rx="11" fill="#B4592E"/><text x="52" y="84" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#F7F6F2" text-anchor="start" font-weight="bold" style="">CHECKLIST</text><rect x="40" y="120" width="430" height="74" rx="10" fill="#F1EFE8" stroke="#12130F"/><circle cx="66" cy="157.0" r="13" fill="#FFD100" stroke="#12130F"/><text x="66" y="163.0" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#12130F" text-anchor="middle" font-weight="bold" style="">1</text><text x="92" y="163.0" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#12130F" text-anchor="start" font-weight="bold" style="">Bruikbare vs nominale capaciteit (kWh)</text><rect x="490" y="120" width="430" height="74" rx="10" fill="#F1EFE8" stroke="#12130F"/><circle cx="516" cy="157.0" r="13" fill="#FFD100" stroke="#12130F"/><text x="516" y="163.0" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#12130F" text-anchor="middle" font-weight="bold" style="">2</text><text x="542" y="163.0" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#12130F" text-anchor="start" font-weight="bold" style="">Omvormervermogen (kW)</text><rect x="40" y="202" width="430" height="74" rx="10" fill="#F1EFE8" stroke="#12130F"/><circle cx="66" cy="239.0" r="13" fill="#FFD100" stroke="#12130F"/><text x="66" y="245.0" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#12130F" text-anchor="middle" font-weight="bold" style="">3</text><text x="92" y="245.0" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#12130F" text-anchor="start" font-weight="bold" style="">AC- of DC-gekoppeld</text><rect x="490" y="202" width="430" height="74" rx="10" fill="#F1EFE8" stroke="#12130F"/><circle cx="516" cy="239.0" r="13" fill="#FFD100" stroke="#12130F"/><text x="516" y="245.0" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#12130F" text-anchor="middle" font-weight="bold" style="">4</text><text x="542" y="245.0" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#12130F" text-anchor="start" font-weight="bold" style="">Omvormer- en meterkastcompatibiliteit</text><rect x="40" y="284" width="430" height="74" rx="10" fill="#F1EFE8" stroke="#12130F"/><circle cx="66" cy="321.0" r="13" fill="#FFD100" stroke="#12130F"/><text x="66" y="327.0" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#12130F" text-anchor="middle" font-weight="bold" style="">5</text><text x="92" y="327.0" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#12130F" text-anchor="start" font-weight="bold" style="">EMS en dynamische sturing</text><rect x="490" y="284" width="430" height="74" rx="10" fill="#F1EFE8" stroke="#12130F"/><circle cx="516" cy="321.0" r="13" fill="#FFD100" stroke="#12130F"/><text x="516" y="327.0" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#12130F" text-anchor="middle" font-weight="bold" style="">6</text><text x="542" y="327.0" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#12130F" text-anchor="start" font-weight="bold" style="">Garantie, laadcycli en degradatie</text><rect x="40" y="366" width="430" height="74" rx="10" fill="#F1EFE8" stroke="#12130F"/><circle cx="66" cy="403.0" r="13" fill="#FFD100" stroke="#12130F"/><text x="66" y="409.0" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#12130F" text-anchor="middle" font-weight="bold" style="">7</text><text x="92" y="409.0" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#12130F" text-anchor="start" font-weight="bold" style="">Uitbreidbaarheid</text><rect x="490" y="366" width="430" height="74" rx="10" fill="#F1EFE8" stroke="#12130F"/><circle cx="516" cy="403.0" r="13" fill="#FFD100" stroke="#12130F"/><text x="516" y="409.0" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#12130F" text-anchor="middle" font-weight="bold" style="">8</text><text x="542" y="409.0" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#12130F" text-anchor="start" font-weight="bold" style="">Noodstroom (stopcontact of hele woning)</text><rect x="40" y="448" width="430" height="74" rx="10" fill="#F1EFE8" stroke="#12130F"/><circle cx="66" cy="485.0" r="13" fill="#FFD100" stroke="#12130F"/><text x="66" y="491.0" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#12130F" text-anchor="middle" font-weight="bold" style="">9</text><text x="92" y="491.0" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#12130F" text-anchor="start" font-weight="bold" style="">Installatie en veiligheid</text><rect x="490" y="448" width="430" height="74" rx="10" fill="#F1EFE8" stroke="#12130F"/><circle cx="516" cy="485.0" r="13" fill="#FFD100" stroke="#12130F"/><text x="516" y="491.0" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#12130F" text-anchor="middle" font-weight="bold" style="">10</text><text x="542" y="491.0" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#12130F" text-anchor="start" font-weight="bold" style="">Vaste kosten, winstdeling en terugleverkosten</text><text x="40" y="542" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4C4D46" text-anchor="start" font-weight="normal" style="font-style:italic;">Vergelijk systemen, niet alleen de prijs of de kWh. Vermogen, EMS en kostenstructuur bepalen het verschil.</text></svg>