<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="t d"><title id="t">Beslishulp: welke thuisbatterij past bij mijn situatie</title><desc id="d">Stapsgewijze beslishulp op basis van zon, contract, vermogen, EMS en aansluiting.</desc><rect width="960" height="600" fill="#F7F6F2"/><text x="40" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#12130F" text-anchor="start" font-weight="bold" style="">Welke thuisbatterij past bij mijn situatie?</text><rect x="40" y="69" width="110" height="22" rx="11" fill="#B4592E"/><text x="52" y="84" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#F7F6F2" text-anchor="start" font-weight="bold" style="">BESLISHULP</text><rect x="40" y="130" width="880" height="66" rx="10" fill="#F1EFE8" stroke="#12130F"/><text x="60" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#12130F" text-anchor="start" font-weight="bold" style="">1. Heeft u zonnepanelen met overschot?</text><text x="60" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4C4D46" text-anchor="start" font-weight="normal" style="">Ja → opslag loont; Nee → focus op handel</text><path d="M480 196 L480 210" stroke="#12130F" stroke-width="2" marker-end="url(#ar)"/><rect x="40" y="216" width="880" height="66" rx="10" fill="#F1EFE8" stroke="#12130F"/><text x="60" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#12130F" text-anchor="start" font-weight="bold" style="">2. Wilt/kunt u een dynamisch contract?</text><text x="60" y="266" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4C4D46" text-anchor="start" font-weight="normal" style="">Ja → handel mogelijk; Nee → zelfconsumptie</text><path d="M480 282 L480 296" stroke="#12130F" stroke-width="2" marker-end="url(#ar)"/><rect x="40" y="302" width="880" height="66" rx="10" fill="#F1EFE8" stroke="#12130F"/><text x="60" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#12130F" text-anchor="start" font-weight="bold" style="">3. Past het omvormervermogen bij snelle laad-/ontlaadmomenten?</text><text x="60" y="352" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4C4D46" text-anchor="start" font-weight="normal" style="">Zo niet → kies meer kW, niet alleen kWh</text><path d="M480 368 L480 382" stroke="#12130F" stroke-width="2" marker-end="url(#ar)"/><rect x="40" y="388" width="880" height="66" rx="10" fill="#F1EFE8" stroke="#12130F"/><text x="60" y="416" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#12130F" text-anchor="start" font-weight="bold" style="">4. Levert de aanbieder een goed EMS zonder hoge vaste kosten?</text><text x="60" y="438" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4C4D46" text-anchor="start" font-weight="normal" style="">Bepaalt hoeveel u zelf overhoudt</text><path d="M480 454 L480 468" stroke="#12130F" stroke-width="2" marker-end="url(#ar)"/><rect x="40" y="474" width="880" height="66" rx="10" fill="#F1EFE8" stroke="#12130F"/><text x="60" y="502" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#12130F" text-anchor="start" font-weight="bold" style="">5. Klopt de meterkast/aansluiting (1- of 3-fase)?</text><text x="60" y="524" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4C4D46" text-anchor="start" font-weight="normal" style="">Zie installatie-eisen</text><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#12130F"/></marker></defs><rect x="40" y="560" width="880" height="52" rx="10" fill="#B4592E"/><text x="480" y="592" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#F7F6F2" text-anchor="middle" font-weight="bold" style="">Vergelijk op vermogen + EMS + kosten — en reken uw situatie door in de calculator</text></svg>