<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="t d"><title id="t">Capaciteit (kWh) versus vermogen (kW)</title><desc id="d">kWh is hoeveel energie u opslaat, kW hoe snel u laadt of ontlaadt; beoordeel ze samen.</desc><rect width="960" height="520" fill="#F7F6F2"/><text x="40" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#12130F" text-anchor="start" font-weight="bold" style="">Capaciteit versus vermogen: kWh versus kW</text><rect x="40" y="69" width="76" height="22" rx="11" fill="#B4592E"/><text x="52" y="84" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#F7F6F2" text-anchor="start" font-weight="bold" style="">UITLEG</text><rect x="40" y="120" width="420" height="340" rx="10" fill="#FFFDF0" stroke="#12130F"/><text x="60" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#12130F" text-anchor="start" font-weight="bold" style="">Capaciteit (kWh)</text><text x="60" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#4C4D46" text-anchor="start" font-weight="normal" style="">Hóeveel energie u kunt opslaan.</text><rect x="80" y="230" width="120" height="170" rx="10" fill="none" stroke="#12130F" stroke-width="3"/><rect x="84" y="300" width="112" height="96" rx="6" fill="#FFD100"/><text x="230" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4C4D46" text-anchor="start" font-weight="normal" style="">= de ‘inhoud’ van</text><text x="230" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4C4D46" text-anchor="start" font-weight="normal" style="">de batterij</text><text x="60" y="440" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4C4D46" text-anchor="start" font-weight="normal" style="font-style:italic;">Bepaalt hoe lang u van eigen stroom leeft.</text><rect x="500" y="120" width="420" height="340" rx="10" fill="#FFFDF0" stroke="#12130F"/><text x="520" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#12130F" text-anchor="start" font-weight="bold" style="">Vermogen (kW)</text><text x="520" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#4C4D46" text-anchor="start" font-weight="normal" style="">Hoe snél u kunt laden/ontladen.</text><path d="M540 320 L740 320" stroke="#B4592E" stroke-width="10" marker-end="url(#a2)"/><defs><marker id="a2" markerWidth="12" markerHeight="12" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#B4592E"/></marker></defs><text x="520" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4C4D46" text-anchor="start" font-weight="normal" style="">= het ‘debiet’ (kilowatts)</text><text x="520" y="440" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4C4D46" text-anchor="start" font-weight="normal" style="font-style:italic;">Bepaalt of u korte prijs-/onbalansvensters benut.</text><text x="40" y="495" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#12130F" text-anchor="start" font-weight="bold" style="">Meer opslag helpt pas als de omvormer die energie snel genoeg kan verplaatsen — beoordeel kWh én kW samen.</text></svg>